    workflows:
      - id: admin-routine
        name: Administrative routine
        definition:
          schema_version: 1
          tasks:
            - id: adhoc
              kind: openclaw
              title: Ad-hoc administrative task
              definition_of_done: The originating request is linked as evidence before start, and the outcome is linked as evidence before completion.
              depends_on: []
              input: {}
  - key: maintenance
    name: Maintenance
    workflows:
      - id: maintenance-routine
        name: Maintenance routine
        definition:
