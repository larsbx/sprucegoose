schema_version: 1
#
# Bare-string `project` form is deliberate: Applier.project_spec/1 returns
# name: nil for it, and update_project/2 is then a no-op, so applying this
# manifest does not rewrite the openclaw-system project row.
#
# Applier.materialize is upsert-only (no destroy, delete, or prune), so
# applying a manifest adds or updates the roadmaps and workflows it names and
# leaves every other row alone.
#
# This manifest supersedes .sprucegoose/admission-bootstrap.yaml, which was
# merged but never registered or applied. See docs/errata/2026-08-31-admission-
# bootstrap-false-premise.md.
project: openclaw-system
roadmaps:
  - key: operational-assurance-backlog
    name: Operational Assurance Backlog
    workflows:
      - id: operational-assurance-v1
        name: Operational Assurance v1
        definition:
          schema_version: 1
          tasks:
            - id: admission-doc-correction
              kind: openclaw
              title: Correct stale task admission guidance in agent instructions
              definition_of_done: >-
                AGENTS.md and TOOLS.md describe the task admission path the
                deployed release actually implements, no longer instruct agents
                to use the retired `task add --project ... --dod ...` syntax,
                and state which host holds task authority and which local
                database is non-authoritative. The guidance directs agents to
                query authority state through the authenticated CLI rather than
                a local PostgreSQL instance. Changes are committed and pushed
                through the configured publication authority with local and
                remote refs compared.
              depends_on: []
              input: {}
            - id: coop-substrate-dependency-audit
              kind: openclaw
              title: Audit coop_substrate dependencies and static-analysis coverage
              definition_of_done: >-
                The Elixir and Rust suites are executed and pass, including the
                committed canonical-encoding vector lock. Dependency advisories
                are recorded with explicit reachability analysis rather than
                scanner output alone, and the absence of static analysis is
                documented as a finding. No dependency bump or source change is
                made without separate approval.
              depends_on: []
              input: {}
            - id: papa-offhost-backup-verification
              kind: openclaw
              title: Verify off-host backup custody for irreplaceable papa state
              definition_of_done: >-
                An off-host archive of papa's irreplaceable state exists on the
                authority host with identical source and destination SHA-256
                digests, and is proven restorable by decompressing and listing
                it at the destination rather than by transfer exit status.
                Live databases are captured with a version-matched dump against
                the running server, never by copying a live data directory, and
                each dump is checked for non-empty output. Excluded rebuildable
                and credential-bearing paths are proven absent from the archive
                listing.
              depends_on: []
              input: {}
            - id: handoff-credential-rotation
              kind: openclaw
              title: Rotate credentials transferred in an approved custody handoff
              definition_of_done: >-
                Every credential transferred in an approved handoff is rotated
                at its issuing authority, dependent services are restarted and
                verified healthy, and each superseded value is confirmed
                non-functional by an explicit authentication failure rather than
                by a command's success message. Rotation order places
                token-signing and database credentials first. No secret value is
                printed to a transcript, process list, or log.
              depends_on: []
              input: {}
