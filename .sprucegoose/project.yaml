schema_version: 1
# Applied via `blueprint apply`; `register` records a revision without materializing it.
project:
  key: openclaw-system
  name: OpenClaw System
roadmaps:
  - key: sprucegoose-control-plane-convergence
    name: SpruceGoose Control Plane Convergence
    workflows:
      - id: sprucegoose-convergence-v1
        name: SpruceGoose Convergence v1
        definition:
          schema_version: 1
          tasks:
            - id: authority-contract
              kind: openclaw
              title: Establish the authority contract
              definition_of_done: The constitutive, operative, evidentiary, and projection authorities are explicit and reviewed.
              depends_on: []
              input: {}
            - id: knowledge-projection
              kind: openclaw
              title: Project constitutive knowledge
              definition_of_done: Repository definitions are verified and materialized with exact immutable source bindings.
              depends_on: [authority-contract]
              input: {}
            - id: artifact-boundary-signer
              kind: openclaw
              title: Establish immutable artifact custody and independent signing
              definition_of_done: Content-addressed artifact storage and a signer isolated from derivation executors pass positive, substitution-refusal, overwrite-refusal, secret-custody, recovery, and repository-publication checks without granting deployment authority.
              depends_on: [knowledge-projection]
              input: {}
            - id: repository-relevance-sweep
              kind: openclaw
              title: Sweep stale SpruceGoose repository material
              definition_of_done: Every tracked file is classified against current source and live state; stale audits and superseded documents are deleted or moved into an explicit non-authoritative archive with Git recovery; current-state documentation is updated; focused and full checks pass; scoped commits are pushed with exact local/remote parity.
              depends_on: [knowledge-projection]
              input: {}
            - id: current-state-audit
              kind: openclaw
              title: Audit current SpruceGoose authority-plane state
              definition_of_done: An evidence-backed, read-only audit compares the current repository, deployed service, constitutive bindings, operative ledger, projections, and legacy epoch against the governed authority contract; findings include severity, proof, limitations, and separately governed remediation boundaries.
              depends_on: [authority-contract]
              input: {}
            - id: ada-runtime-diagnosis
              kind: openclaw
              title: Diagnose Ada production response failure
              definition_of_done: Read-only checks identify the current Ada failure boundary across the Mama Hermes service, messaging consumer, gateway, and provider authentication; sanitized finding, reproducible regression evidence, and the governing SOP reference are attached; no remediation or credential mutation occurs.
              depends_on: []
              input: {}
            - id: ada-runtime-model-repair
              kind: openclaw
              title: Restore Ada with a supported Codex model
              definition_of_done: Mama Hermes uses a ChatGPT Codex-supported model; the production gateway is restarted through its governed user service; health, provider authentication, Telegram routing, and a bounded inference smoke test pass; rollback configuration is retained and no credential is exposed or replaced.
              depends_on: [ada-runtime-diagnosis]
              input: {}
            - id: constitutive-mutation-lockdown
              kind: openclaw
              title: Lock constitutive hierarchy mutations to repository blueprints
              definition_of_done: Production Project, Roadmap, and Workflow creation, rename, and removal are unavailable outside exact verified BlueprintRevision application; existing hierarchy rows remain readable; isolated bootstrap and migration compatibility are explicit; Ash actions, CLI refusal, PostgreSQL constraints where applicable, compiled-CLI dogfood, and positive/refusal regressions pass.
              depends_on: [knowledge-projection]
              input: {}
            - id: constitutional-vertical-slice
              kind: openclaw
              title: Implement one constitutional authorization path
              definition_of_done: One typed OntologyVersion through Proposition, Claim/Evidence, Justification, Norm/Grant, Resolution, Authorization, and EffectIntent path binds exact constitutive roots and passes positive, substitution, missing-root, stale-grant, and unauthorized-effect refusal tests without executing a real effect.
              depends_on: [authority-contract]
              input: {}
            - id: certified-event-ledger-shadow
              kind: openclaw
              title: Add the certified PostgreSQL EventLedger in shadow mode
              definition_of_done: PostgreSQL appends immutable ordered certified events with exact content identity and idempotency, refuses conflicting reuse and mutation, verifies required constitutive roots, retains mutable tables as authority during shadow mode, and passes migration, concurrency, recovery, and compiled-CLI dogfood gates.
              depends_on: [constitutive-mutation-lockdown, constitutional-vertical-slice]
              input: {}
            - id: certified-event-shadow-append
              kind: openclaw
              title: Append certified shadow events transactionally
              definition_of_done: Every accepted mutation in the baseline replay scope appends one root-valid certified candidate event in the same transaction; reconciliation detects missing, duplicate, reordered, or invalid events; mutable rows remain authority; positive, rollback, concurrency, recovery, and compiled-CLI dogfood gates pass.
              depends_on: [certified-event-ledger-shadow]
              input: {}
            - id: grandfathered-baseline
              kind: openclaw
              title: Bind the grandfathered legacy baseline
              definition_of_done: One content-addressed immutable baseline snapshot records the exact final legacy position and schema, one GrandfatheredStateAccepted certified event binds it, excluded fixtures remain quarantined, no legacy row receives invented provenance, and backup, restore, verification, and refusal gates pass.
              depends_on: [certified-event-shadow-append]
              input: {}
            - id: deterministic-replay-parity
              kind: openclaw
              title: Prove deterministic replay and projection parity
              definition_of_done: Empty-state rebuild, restart, concurrent shadow append completeness, dual-read parity, lag health, direct-projection-write refusal, and rollback to the legacy reader and writer pass without deleting certified events.
              depends_on: [grandfathered-baseline]
              input: {}
            - id: projector-event-routing
              kind: openclaw
              title: Route certified events by projection scope
              definition_of_done: The authoritative-task projector applies supported task mutations, advances across valid certified non-task events without projecting them, and fails closed on malformed or unsupported task mutations; focused, full, replay, recovery, migration, compiled-CLI, deployment, zero-lag, and parity gates pass without deleting certified events or transferring authority.
              depends_on: [deterministic-replay-parity]
              input: {}
            - id: postgresql-ga-readiness-diagnosis
              kind: openclaw
              title: Diagnose PostgreSQL GA upgrade readiness
              definition_of_done: Read-only source, package, extension, migration, backup, restore, rollback, and application-compatibility checks identify a supported PostgreSQL GA target and an evidence-backed upgrade boundary; finding, regression, and SOP references are attached; no package, service, database, credential, or production configuration is mutated.
              depends_on: [projector-event-routing]
              input: {}
            - id: certified-derivation-receipts
              kind: openclaw
              title: Bind derivation permits and certify immutable outcomes
              definition_of_done: Derivation permits bind the exact ontology, schema, norm, policy, grant and revocation epoch, agent charter, interpreter, and evidence-policy roots; claim and completion no longer mutate permit authority; one append-only certified receipt records each terminal outcome; substitution, stale-epoch, duplicate, mutation, rollback, concurrency, migration, compiled-CLI, full regression, deployment, and live verification gates pass.
              depends_on: [deterministic-replay-parity, constitutional-vertical-slice]
              input: {}
            - id: ooda-shadow
              kind: openclaw
              title: Shadow the Pi OODA path
              definition_of_done: Pi decisions run in shadow mode with parity and refusal evidence.
              depends_on: [knowledge-projection]
              input: {}
            - id: taskflow-shadow
              kind: openclaw
              title: Shadow TaskFlow execution
              definition_of_done: TaskFlow execution is shadowed by SpruceGoose with resumability and parity evidence.
              depends_on: [authority-contract]
              input: {}
            - id: sprucegoose-sole-writer
              kind: openclaw
              title: Make SpruceGoose the sole writer
              definition_of_done: New governed task admission and lifecycle writes occur only through SpruceGoose.
              depends_on: [ooda-shadow, taskflow-shadow]
              input: {}
            - id: runtime-capability-transfer
              kind: openclaw
              title: Transfer bounded runtime capabilities
              definition_of_done: Typed bounded executors replace generic runtime authority and pass positive and refusal canaries.
              depends_on: [sprucegoose-sole-writer]
              input: {}
            - id: canary-cutover
              kind: openclaw
              title: Canary the authority cutover
              definition_of_done: Forward event authority and deterministic projections pass replay, recovery, and parity canaries.
              depends_on: [runtime-capability-transfer, projector-event-routing]
              input: {}
            - id: legacy-retirement
              kind: openclaw
              title: Retire legacy writers
              definition_of_done: Superseded writers are disabled after rollback-safe cutover evidence is retained.
              depends_on: [canary-cutover]
              input: {}
            - id: forgejo-publication-inventory
              kind: openclaw
              title: Inventory host repository publication authority
              definition_of_done: Every Git repository under the host home directory is classified by exact remote URL against the Forgejo publication authority, distinguishing already-published repositories, unpublished own repositories, third-party upstream clones that must not migrate, linked worktrees that inherit their parent remote, and credential-bearing repositories requiring separate handling; classification is derived from live remote and API reads rather than hostname pattern matching, private repositories are resolved with an authenticated read so absence is never inferred from an anonymous refusal, and each dirty worktree is recorded with its owning task rather than absorbed.
              depends_on: []
              input: {}
            - id: forgejo-publication-migration
              kind: openclaw
              title: Publish unpublished own repositories to Forgejo
              definition_of_done: Every own repository classified as unpublished has a Forgejo repository created under the publication authority, a forgejo remote configured, and all branches and tags pushed, with local and remote object identity compared per repository and recorded; third-party upstream clones retain their upstream remotes and are not migrated; GitHub remains configured as a private mirror rather than being removed; no credential material is published; repositories whose worktrees are dirty or owned by another active task are recorded as waiting with exact paths instead of being force-cleaned.
              depends_on: [forgejo-publication-inventory]
              input: {}
            - id: deontic-overlay-norm-root-candidate
              kind: openclaw
              title: Publish the neutral deontic overlay as a norm-root candidate
              definition_of_done: The deontic and precedence overlays and their three executable certificates are committed to the repository in neutral deontic-logic vocabulary with no residual domain-specific terminology, each certificate re-runs from its committed path and exits zero with its stated law count reproduced rather than assumed, the terminology map records both the rename and the two substantive corrections it forced, the artifacts remain explicitly DRAFT and claim no adoption or authority, and the branch is published through the Forgejo publication authority with local and remote commit identity compared and a pull request opened against protected main.
              depends_on: [constitutional-vertical-slice]
              input: {}
            - id: spec-adopted-primitive
              kind: openclaw
              title: Add the SpecAdopted primitive and adopt the deontic overlay
              definition_of_done: A typed content-addressed adoption primitive binds the exact spec ContentID, all eight roots, the constitutional authorization identity, the decision reference, and the grant/revocation epoch into one immutable certified event with conflict-safe idempotency; adoption is reachable only by traversing the existing constitutional path so an operational role or a task identifier alone can never establish it, and the effect allowlist is not widened because adoption consumes the resulting Authorization rather than executing an effect; the verifier refuses self-declared adoption asserted inside the candidate payload, stale epoch, substituted bytes, superseded and revoked identities, and reused idempotency keys carrying changed content, each with the refusal name the contract already defines; lifecycle transitions remain monotonic and amendment is replacement only; deterministic replay and projection-write refusal are preserved and demonstrated; every refusal has a failing witness rather than a vacuous pass; the full suite, formatting, and warnings-as-errors compilation are green; the exact committed bytes of the deontic overlay are then adopted through that path and the resulting certified event is read back and verified independently; and the branch is published through the Forgejo publication authority with local and remote commit identity compared and a pull request opened against protected main.
              depends_on: [deontic-overlay-norm-root-candidate]
              input: {}
            - id: openclaw-secrets-vaultwarden-custody
              kind: openclaw
              title: Move OpenClaw secrets into Vaultwarden custody
              definition_of_done: Credential material held in the local secrets repository is transferred into Vaultwarden through the bw CLI with per-item verification that each stored secret reads back byte-identical, the secrets repository is never pushed to Forgejo or any mirror, retention or destruction of the local copy is an explicit recorded decision rather than an implied side effect, and rollback remains possible until readback verification passes for every item.
              depends_on: [forgejo-publication-inventory]
              input: {}
            - id: papa-decommission-inventory
              kind: openclaw
              title: Inventory Papa decommission readiness before any wipe
              definition_of_done: Every service, systemd unit, timer, container, credential, DNS or tailnet route, listener, backup destination, recovery path, and publication authority still resident on Papa is enumerated from live host reads rather than from documentation or memory, and each is classified as already migrated to Mama, still Papa-only, or deliberately terminal; every item claimed migrated is proven by an independent read against Mama rather than by the migration record asserting itself, with identity compared where the item has a digest, commit, or content hash; backup freshness is proven by listing the offhost destination rather than trusting a job success line, and at least one restore or recovery path is exercised rather than assumed; Papa-only items are recorded with an owning task and an explicit disposition rather than left implicit; findings that block wipe readiness are recorded as blockers with exact evidence; and the inventory explicitly states that it authorizes nothing destructive, because the final wipe remains a separately governed human-approved action that this task must not perform, imply, or schedule.
              depends_on: [forgejo-publication-inventory]
              input: {}
            - id: evidence-absence-detection
              kind: openclaw
              title: Make missing and unverified SpruceGoose evidence detectable in Ash
              definition_of_done: Evidence becomes a first-class timestamped Ash resource rather than anonymous JSON, and detection of absent or unproven evidence is expressed as typed Ash reads. A TaskReference resource carries kind, value, recorded_at, and recording actor, is registered in the Workflows domain, relates to Task, and is written through the actor-bound authorization surface. Existing references inside Task.input are migrated without fabricating times; since per-reference timestamps never existed, migrated rows are explicitly marked backfilled with unknown recording time, and backfilled rows never count as genuine freshness. Probe destinations are data rather than hardcoded hosts, so a typed target resource describes each destination and its access method, and no host name, address, or path is embedded in check logic. Three detections follow, namely staleness for in-progress tasks whose newest genuine reference predates a supplied threshold, a precondition detection for tasks whose Definition of Done requires verification but which carry no finding or regression reference, and completion verification re-probing declared targets, demonstrated against the known-false completions openclaw-secrets-vaultwarden-custody and the Woodpecker Papa retirement and correctly reporting at least one unproven. Probe execution stays outside the data layer so replay and projection determinism are preserved, while target selection, eligibility, and verdicts are owned and stored by SpruceGoose. Every detection returns a non-empty result on live data with real output recorded on the task, each has a test that fails when the detection is removed or inverted, migrations are applied to development and test databases, generated migrations report no snapshot drift, formatting and warnings-as-errors compilation are green, the full suite passes, and the branch is published with local and remote commit identity compared. No destructive action, deletion, service state change, or wipe is authorized.
              depends_on: [papa-decommission-inventory]
              input: {}
            - id: evidence-open-vocabulary-deploy
              kind: openclaw
              title: Deploy the open-vocabulary evidence change and backfill historical references
              definition_of_done: The open-vocabulary reference kind change is deployed to the authority through the governed release path and proven on live data. A release is built from a clean worktree at the published commit, transferred with byte-identical digest verification, and validated against a destination migration inventory read from the authority itself rather than from a development database. Activation uses a task identifier whose rollback slot and activation record do not already exist, so the previous release stays recoverable rather than being overwritten or deleted. After activation the service is confirmed running with the task count unchanged and the authority readable through the CLI. Historical references stored inside Task.input are then backfilled into TaskReference rows marked backfilled with no recorded_at, with the migrated count compared against the source count and any rejected row reported rather than silently skipped. Backfill is idempotent or guarded so a repeat run cannot duplicate rows. Finally the three detections are run against the live authority and their real output is recorded, including at least one non-empty result and the two known-false completions probed. No destructive action, no deletion of a rollback slot, no service state change beyond the governed activation restart, and no wipe is authorized.
              depends_on: [evidence-absence-detection]
              input: {}
            - id: openclaw-mama-relocation
              kind: openclaw
              title: Install OpenClaw on Mama and transfer agent memory
              definition_of_done: OpenClaw exists on the successor host with the agent's durable memory transferred intact, without creating a second live agent. The stale ~/.openclaw tree already present on Mama, dated 2026-08-02 and lacking any config or runtime, is moved aside as a dated artifact and preserved rather than deleted or merged into, because rsyncing live state over it would silently produce a hybrid of old and current memory. A Node runtime and the OpenClaw package are installed on Mama and their versions recorded. Workspace, vaults, and agent session history are transferred and verified by comparing file counts and content digests against the source rather than by trusting the transfer tool's exit status, with any divergence reported. Reproducible material such as npm caches, browser profiles, and extensions is deliberately excluded and that exclusion is recorded. Installed OpenClaw is confirmed able to read the transferred memory. Gateway activation is explicitly NOT performed and remains a separate owner-approved action, because starting a second gateway while the Papa gateway still runs would create two live agents sharing one set of credentials, schedules, and messaging channels, with duplicate cron firing and conflicting writes. Credential material is not copied into any repository. The task authorizes no service stop on Papa, no deletion of the stale tree, no destructive action, and no wipe.
              depends_on: [papa-decommission-inventory]
              input: {}
            - id: sprucegoose-source-branch-protection
              kind: openclaw
              title: Govern the SpruceGoose source repository with branch protection
              definition_of_done: The Forgejo repository holding the SpruceGoose constitutive blueprints is brought under the same publication discipline as the canonical knowledge base rather than remaining less governed than the material it governs. The current unprotected state is recorded as evidence before any change, with the contrast against the protected knowledge-base repository captured from the same interface so the finding is not an artifact of one probe. Protection is then applied to the default branch so direct pushes are refused and changes arrive through pull requests, and the refusal is proven empirically by attempting a direct push and capturing the rejection rather than assuming the setting works. Existing task branches and open pull requests continue to function, verified after the change. The applied configuration is recorded so it can be reproduced on future deployments. No history is rewritten, no branch is deleted, no credential is created or broadened, and the task authorizes no destructive action.
              depends_on: []
              input: {}
