name: SpruceGoose toolchain
description: Provision the repository BEAM versions and the supported audit tool
runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        version-file: .tool-versions
        version-type: strict
        install-hex: 'false'
    - shell: bash
      run: mix local.hex 2.5.1 --force
