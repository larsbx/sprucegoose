name: Artifact delivery
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Existing governing task ID for this artifact build
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: artifact-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI_PIPELINE_NUMBER: ${{ github.run_id }}
      SPRUCE_GOOSE_TEST_DATABASE_USERNAME: postgres
      SPRUCE_GOOSE_TEST_DATABASE_PASSWORD: ci-only-disposable-password
      SPRUCE_GOOSE_TEST_DATABASE_HOSTNAME: 127.0.0.1
      SPRUCE_GOOSE_TASK: ${{ inputs.task_id }}
      SPRUCE_GOOSE_BUILDER: github-actions-ubuntu-24.04
      SPRUCE_GOOSE_TRANSACTION: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate task binding before provisioning
        shell: bash
        run: '[[ $SPRUCE_GOOSE_TASK =~ ^tsk-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$ ]]'
      - uses: ./.github/actions/setup
      - run: scripts/check-local
      - name: Check and build this exact commit
        env:
          CI_RELEASE_OUTPUT_ROOT: ${{ runner.temp }}/governed-release
          SPRUCE_GOOSE_TEST_DATABASE_PORT: ${{ job.services.postgres.ports[5432] }}
        shell: bash
        run: |
          set -o pipefail
          scripts/ci-governed-release --release 2>&1 | tee "$RUNNER_TEMP/delivery.log"
      - name: Deliver validated archive and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governed-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/governed-release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            !ci-evidence/*.dump
            ${{ runner.temp }}/delivery.log
          retention-days: 30
