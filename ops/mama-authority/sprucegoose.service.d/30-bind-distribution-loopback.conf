# Bind epmd and Erlang distribution to loopback.
#
# Before this, epmd (4369) and the distribution port were on 0.0.0.0 and
# reachable from the public internet on 5.78.103.70 (verified off-host
# 2026-08-29). Erlang distribution grants RCE to anyone holding the node
# cookie, and cookies are visible in `ps` to any local account.
#
# Safe because nothing clusters: Node.list() is empty and there is no
# libcluster strategy in the release. Local `bin/spruce_goose rpc` still
# works — it connects over loopback.
[Service]
Environment=ERL_EPMD_ADDRESS=127.0.1.1
Environment="ERL_FLAGS=-kernel inet_dist_use_interface {127,0,1,1}"
